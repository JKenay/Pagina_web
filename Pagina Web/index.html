<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Diaria: Conquista tus Metas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor">
        <header class="cabecera">
            <img src="https://images.unsplash.com/photo-1484480974693-6ca0a78fb36b?auto=format&fit=crop&w=800&q=80" alt="Productividad" class="imagen-cabecera">
            <h1 class="titulo">Misión Diaria</h1>
            <p class="subtitulo">Organiza tus tareas y domina tu día</p>
        </header>

        <form id="formulario-tarea" class="formulario">
            <input type="text" id="input-tarea" class="campo-texto" placeholder="¿Qué tarea vas a hacer?" required>
            
            <div class="opciones">
                <select id="select-dificultad" class="selector-dificultad">
                    <option value="Fácil">Fácil</option>
                    <option value="Medio" selected>Medio</option>
                    <option value="Difícil">Difícil</option>
                </select>
                <button type="submit" class="boton-agregar">Agregar</button>
            </div>
        </form>

        <ul id="lista-tareas" class="lista-tareas"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
